<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logs & Traces | CardConsole Insights</title><link rel="stylesheet" href="styles.css"></head>
<body><script src="app.js"></script><script>layout("Logs & Traces","logs","\n<div class=\"page-title\"><div><h1>Logs & Traces</h1><p>Search CardConsole backend logs in Splunk and correlate them with trace IDs.</p></div><div class=\"actions\"><a class=\"btn secondary\" href=\"ai-assistant.html\">Generate Splunk query</a></div></div>\n<div class=\"card\"><div class=\"searchbar\"><input id=\"logSearch\" placeholder=\"Search traceId, user, endpoint, error message...\" value=\"\"><button class=\"btn\" onclick=\"filterLogs()\">Search</button></div><div class=\"quick-prompts\"><button onclick=\"document.getElementById('logSearch').value='b4e8d1c9f7';filterLogs()\">b4e8d1c9f7</button><button onclick=\"document.getElementById('logSearch').value='504';filterLogs()\">504 errors</button><button onclick=\"document.getElementById('logSearch').value='session expired';filterLogs()\">302 session</button></div></div>\n<div class=\"card section-gap\"><div style=\"display:flex;justify-content:space-between\"><div><h3>Splunk result set</h3><div class=\"sub\">Mocked results \u2022 source=cardconsole-backend</div></div><span class=\"status info\">24 results</span></div><div class=\"table-wrap\" style=\"margin-top:10px\"><table class=\"table\" id=\"logsTable\"><thead><tr><th>Time</th><th>Level</th><th>Trace ID</th><th>Service</th><th>Message</th><th>Action</th></tr></thead><tbody>\n<tr data-search=\"b4e8d1c9f7 504 domain service timeout\"><td>15:12:34</td><td><span class=\"status error\">ERROR</span></td><td><a class=\"tag\" href=\"trace-detail.html?id=b4e8d1c9f7\">b4e8d1c9f7</a></td><td>CardConsole Backend</td><td>Calling domain service /cardholder/health</td><td><a class=\"tag\" href=\"trace-detail.html?id=b4e8d1c9f7\">Trace</a></td></tr>\n<tr data-search=\"b4e8d1c9f7 504 gateway timeout\"><td>15:12:36</td><td><span class=\"status error\">ERROR</span></td><td><a class=\"tag\" href=\"trace-detail.html?id=b4e8d1c9f7\">b4e8d1c9f7</a></td><td>Domain-Service</td><td>Domain service response: 504 Gateway Timeout</td><td><a class=\"tag\" href=\"domain-services.html\">Service</a></td></tr>\n<tr data-search=\"c7d2a6e5b1 500 database error\"><td>15:08:12</td><td><span class=\"status error\">ERROR</span></td><td><a class=\"tag\" href=\"trace-detail.html?id=c7d2a6e5b1\">c7d2a6e5b1</a></td><td>CardConsole Backend</td><td>Unhandled downstream exception</td><td><a class=\"tag\" href=\"trace-detail.html?id=c7d2a6e5b1\">Trace</a></td></tr>\n<tr data-search=\"a1f3e9c2b4 200 success\"><td>15:05:18</td><td><span class=\"status ok\">INFO</span></td><td><a class=\"tag\" href=\"trace-detail.html?id=a1f3e9c2b4\">a1f3e9c2b4</a></td><td>CardConsole Backend</td><td>Request completed successfully</td><td><a class=\"tag\" href=\"trace-detail.html?id=a1f3e9c2b4\">Trace</a></td></tr>\n</tbody></table></div></div>\n<div class=\"grid grid-2 section-gap\"><div class=\"card\"><h3>AI-generated Splunk query</h3><pre style=\"background:#f8fafc;border:1px solid var(--line);padding:13px;border-radius:8px;font-size:10px;white-space:pre-wrap\">index=cardconsole sourcetype=backend\n| search traceId=\"b4e8d1c9f7\"\n| sort _time\n| table _time level service endpoint status traceId message</pre><a class=\"btn\" href=\"ai-assistant.html\">Refine with AI</a></div><div class=\"card\"><h3>Correlation</h3><div class=\"list\"><div class=\"list-item\"><span>Datadog session</span><a class=\"tag\" href=\"user-experience.html\">sess_9f8a12</a></div><div class=\"list-item\"><span>Backend logs</span><a class=\"tag\" href=\"trace-detail.html?id=b4e8d1c9f7\">6 events</a></div><div class=\"list-item\"><span>Domain service</span><a class=\"tag\" href=\"domain-services.html\">504</a></div></div></div></div>\n\n");</script>
<script>

function filterLogs(){const q=(document.getElementById('logSearch').value||'').toLowerCase();document.querySelectorAll('#logsTable tbody tr').forEach(r=>r.style.display=(!q||r.dataset.search.includes(q))?'':'none')}
const params=new URLSearchParams(location.search);if(params.get('q')){document.getElementById('logSearch').value=params.get('q');setTimeout(filterLogs,50)}

</script></body></html>
