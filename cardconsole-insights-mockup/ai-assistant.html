<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Assistant | CardConsole Insights</title><link rel="stylesheet" href="styles.css"></head>
<body><script src="app.js"></script><script>layout("AI Assistant","ai","\n<div class=\"page-title\"><div><h1>AI Assistant</h1><p>Ask questions in natural language. The assistant translates intent into Splunk/RUM/domain-service queries and summarizes the evidence.</p></div></div>\n<div class=\"ai-shell\">\n<div class=\"card chat\">\n<div class=\"chat-head\"><div class=\"ai-orb\">\u2726</div><div><strong>CardConsole Copilot</strong><div class=\"sub\">Connected to Splunk + Datadog RUM + trace-linked domain APIs</div></div></div>\n<div class=\"chat-messages\" id=\"chatMessages\">\n<div class=\"bubble ai\">Hi! I can investigate errors across the complete request path. Try asking:<br><br>\u2022 \u201cShow me everything for trace b4e8d1c9f7\u201d<br>\u2022 \u201cWhy did the cardholder request fail?\u201d<br>\u2022 \u201cShow the user's journey before the error\u201d<br>\u2022 \u201cFind domain service timeouts in the last 24 hours\u201d</div>\n<div class=\"bubble user\">Show me everything for trace b4e8d1c9f7</div>\n<div class=\"bubble ai\"><strong>Trace correlation found</strong><br><br>Datadog RUM \u2192 CardConsole Backend \u2192 Cardholder Domain Service.<br><span class=\"status error\">504 Gateway Timeout</span><pre>index=cardconsole traceId=\"b4e8d1c9f7\"\n| sort _time\n| table _time service endpoint status message</pre><br><strong>Domain API:</strong> /cardholder/health \u00b7 2.8s<br><strong>RUM:</strong> session sess_9f8a12 \u00b7 transaction tab clicked<br><br><a class=\"tag\" href=\"trace-detail.html?id=b4e8d1c9f7\">Open full trace \u2192</a></div>\n</div>\n<div class=\"chat-input\"><input id=\"chatInput\" placeholder=\"Ask anything about logs, users, traces, APIs...\" onkeydown=\"if(event.key==='Enter')sendChat()\"><button class=\"btn\" onclick=\"sendChat()\">\u27a4</button></div>\n<div class=\"quick-prompts\"><button onclick=\"quickChat('Find 504 errors today')\">504 errors today</button><button onclick=\"quickChat('Show user journey for trace b4e8d1c9f7')\">User journey</button><button onclick=\"quickChat('Which domain services are slow?')\">Slow services</button><button onclick=\"quickChat('Generate Splunk query for session redirects')\">Generate query</button></div>\n</div>\n<div>\n<div class=\"card\"><h3>What AI can do</h3><div class=\"list\"><div class=\"list-item\"><span>Generate Splunk SPL</span><span class=\"status info\">SPL</span></div><div class=\"list-item\"><span>Search Datadog RUM</span><span class=\"status info\">RUM</span></div><div class=\"list-item\"><span>Correlate trace ID</span><span class=\"status info\">TRACE</span></div><div class=\"list-item\"><span>Inspect domain API</span><span class=\"status info\">API</span></div><div class=\"list-item\"><span>Explain issue in plain English</span><span class=\"status ok\">AI</span></div></div></div>\n<div class=\"card section-gap\"><h3>Suggested prompts</h3><div class=\"list\"><a class=\"list-item\" href=\"#\" onclick=\"quickChat('Why are users getting 302?');return false\"><div><strong>Session expiry</strong><small>Investigate 302 redirects</small></div><span>\u2192</span></a><a class=\"list-item\" href=\"#\" onclick=\"quickChat('Show all domain timeouts');return false\"><div><strong>Domain timeouts</strong><small>Find downstream bottlenecks</small></div><span>\u2192</span></a><a class=\"list-item\" href=\"#\" onclick=\"quickChat('Compare RUM and backend errors');return false\"><div><strong>Cross-source comparison</strong><small>RUM + Splunk correlation</small></div><span>\u2192</span></a></div></div>\n</div></div>\n\n");</script>
<script>

function addBubble(text,type){const el=document.createElement('div');el.className='bubble '+type;el.innerHTML=esc(text).replace(/\\n/g,'<br>');document.getElementById('chatMessages').appendChild(el);document.getElementById('chatMessages').scrollTop=99999}
function quickChat(text){document.getElementById('chatInput').value=text;sendChat()}
function sendChat(){const input=document.getElementById('chatInput');const q=input.value.trim();if(!q)return;addBubble(q,'user');input.value='';setTimeout(()=>{let answer='I would correlate Datadog RUM, Splunk and the domain service using trace ID.\\n\\nGenerated investigation:\\n1. Identify the RUM session/action.\\n2. Build a Splunk query for matching traceId.\\n3. Inspect downstream endpoint/status/latency.\\n4. Return a plain-language explanation with links.';if(/504|timeout/i.test(q))answer='I found a likely downstream timeout pattern. The next step is to correlate the trace with the Cardholder Service and inspect the 504 response latency.\\n\\nSPL: index=cardconsole traceId=\"b4e8d1c9f7\" | sort _time';if(/journey|user/i.test(q))answer='The correlated RUM journey is: Search → Cardholder → Transaction → Notes → XHR failure.\\n\\nOpen the User Experience page to inspect actions and session details.';addBubble(answer,'ai')},450)}

</script></body></html>
